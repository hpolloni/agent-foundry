name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # No `cache: npm` here: setup-node runs the bundled npm in the repo before the upgrade
          # below, and devEngines makes that older npm fail.
      # The runner's bundled npm can be older than devEngines allows. package.json is the only source of the version.
      - run: npm install -g "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  integration:
    # Integration tests start the real server process. They run on pull requests only.
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # No `cache: npm` here: setup-node runs the bundled npm in the repo before the upgrade
          # below, and devEngines makes that older npm fail.
      # The runner's bundled npm can be older than devEngines allows. package.json is the only source of the version.
      - run: npm install -g "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:integration
